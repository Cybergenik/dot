# change prefix to Ctrl-a (like in gnu-screen)

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set-option -g default-shell /bin/zsh


# start with window 1 (instead of 0)
set -g base-index 1

# close index gaps automatically when a window is closed
set -g renumber-windows on


# start with pane 1
set -g pane-base-index 1


# screen mode
set -g default-terminal "screen-256color"


# source config file
bind r source-file ~/.tmux.conf


# history
set -g history-limit 50000


# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

# use vi mode
setw -g mode-keys vi
set -g status-keys vi


# tmux-zoom.sh
bind C-z run "tmux-zoom.sh"

# easy-to-remember split pane commands
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# colon :
bind : command-prompt

# mouse (select/resize panes and windows)
set -g mouse on

# mouse copy: drag to select, release copies to macOS clipboard (and stay in copy-mode)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
# double/triple-click select word/line then copy to clipboard
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-pipe "pbcopy"
# vi-style copy in copy-mode: v to select, y to yank to clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

# moving between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize the pane
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r H resize-pane -L 3
bind-key -r L resize-pane -R 3

# status line
set -g status-justify left
set -g status-style bg=default,fg=colour12
set -g status-interval 2


# messaging
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black


#window mode
setw -g mode-style fg=colour0,bg=colour6


# window status
#setw -g window-status-format " #F#I:#W#F "
#setw -g window-status-current-format " #F#I:#W#F "
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "
setw -g window-status-current-style fg=colour11,bg=colour0,dim
setw -g window-status-style fg=black,bg=green,reverse

# Info on left (I don't have a session display for now)
set -g status-left ''


# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-window-option -g mode-keys vi
set-option -g bell-action none


# tmux clock
set -g clock-mode-colour blue
set -g clock-mode-style 12


# session-tool: prefix + Shift-F opens fuzzy directory/session picker
bind F display-popup -E "$HOME/.local/bin/st.sh"

# some key-binding changes
bind S new-session
bind x kill-pane
bind X next-layout
bind Z previous-layout

#urxvt tab like window switching (-n: no prior escape seq)
bind -n S-down new-window
bind -n S-left prev
bind -n S-right next
bind -n C-left swap-window -t -1
bind -n C-right swap-window -t +1

set -g default-terminal "screen-256color"

# The modes {

setw -g clock-mode-colour colour135
setw -g mode-style fg=colour196,bg=colour238,bold

# }
# The panes {

set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# }
# The statusbar {

set -g status-position bottom
set -g status-style bg=colour234,fg=colour137,dim
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style fg=colour255,bg=colour1,bold

# }
# The messages {

set -g message-style fg=colour232,bg=colour166,bold

# }

set -g default-command "${SHELL}"
# tmux-yank not needed: clipboard copy handled by native copy-pipe bindings above
# set -g @plugin 'tmux-plugins/tmux-yank'

# session persistence across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# save/restore scrollback and working dirs, not just layout
set -g @resurrect-capture-pane-contents 'on'
# save every 15 min, and restore automatically when the tmux server starts
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# claude sessions: relaunch claude panes as a wrapper that resumes the
# conversation that pane had. Appended to resurrect's defaults (vim, less, ...),
# not a replacement for them. Matched as a whole word, so `claude` and
# `claude --resume foo` are caught while `python3 claude_helper.py` is not.
set -g @resurrect-processes '"claude->claude-resume-pane"'
# map live panes -> conversation ids on every save (continuum autosaves included)
set -g @resurrect-hook-post-save-all '~/.local/bin/claude-tmux-save-sessions'

# keep TPM last
run '~/.tmux/plugins/tpm/tpm'
